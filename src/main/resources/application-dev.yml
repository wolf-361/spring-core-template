spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /docs
    urls:
      - name: core
        url: /v3/api-docs

logging:
  level:
    com.template.core: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-at-least-32-characters-long-ok}
