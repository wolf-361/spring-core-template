services:
  postgres:
    image: postgres:18-alpine
    container_name: core-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-core}
      POSTGRES_USER: ${DB_USER:-core}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-core}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-core} -d ${DB_NAME:-core}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
